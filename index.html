<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/wave-site/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="wave">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>wave</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    /* Fill the iOS status-bar area (black-translucent + viewport-fit=cover). */
    html, body { margin: 0; padding: 0; position: fixed; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background-color: #000000; }
  </style>
  <script>
    /* iOS PWA: viewport size/offset can be measured wrong at launch (taps land offset).
       Reset scroll and make Flutter re-measure after short delays. */
    (function () {
      function fix() {
        window.scrollTo(0, 0);
        window.dispatchEvent(new Event('resize'));
      }
      var timers = [];
      function schedule() {
        window.scrollTo(0, 0);
        timers.forEach(clearTimeout);
        timers = [50, 300, 1000].map(function (ms) { return setTimeout(fix, ms); });
      }
      window.addEventListener('load', schedule);
      window.addEventListener('pageshow', schedule);
      window.addEventListener('orientationchange', schedule);
      document.addEventListener('focusout', schedule);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', schedule);
        window.visualViewport.addEventListener('scroll', schedule);
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
