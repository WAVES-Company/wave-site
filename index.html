<!DOCTYPE html>
<html>
<head>

  <base href="/wave-site/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>wave</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    /* Fill the iOS status-bar area (black-translucent + viewport-fit=cover). */
    html, body { margin: 0; padding: 0; position: fixed; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background-color: #000000; }
  </style>
  <script>
    /* iOS PWA: viewport size/offset can be measured wrong at launch (taps land offset).
       Reset scroll and make Flutter re-measure after short delays. */
    (function () {
      function fix() {
        window.scrollTo(0, 0);
        window.dispatchEvent(new Event('resize'));
      }
      var timers = [];
      function schedule() {
        window.scrollTo(0, 0);
        timers.forEach(clearTimeout);
        timers = [50, 300, 1000].map(function (ms) { return setTimeout(fix, ms); });
      }
      window.addEventListener('load', schedule);
      window.addEventListener('pageshow', schedule);
      window.addEventListener('orientationchange', schedule);
      document.addEventListener('focusout', schedule);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', schedule);
        window.visualViewport.addEventListener('scroll', schedule);
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <!-- iOS Safari: "Add to Home Screen" hint (hidden when installed / standalone). -->
  <style>
    #a2hs { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 2147483647; pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 14px 14px 14px 16px; border-radius: 18px; background: rgba(28, 28, 30, 0.82); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); opacity: 0; transform: translateY(20px); transition: opacity .3s, transform .3s; max-width: 480px; margin: 0 auto; }
    #a2hs.show { opacity: 1; transform: none; }
    #a2hs svg { width: 18px; height: 18px; vertical-align: -3px; margin: 0 2px; }
    #a2hs-text { flex: 1; }
    #a2hs-close { flex: none; width: 30px; height: 30px; border: 0; border-radius: 15px; background: rgba(255, 255, 255, 0.14); color: #fff; display: flex; align-items: center; justify-content: center; line-height: 1; padding: 0; cursor: pointer; }
  </style>
  <script>
    (function () {
      try {
        var ua = navigator.userAgent || '';
        var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var standalone = navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        if (!ios || standalone) return;
        var share = '<svg viewBox="0 0 24 24" fill="none" stroke="#0A84FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
        var ru = /^ru/i.test(navigator.language || '');
        var text = ru
          ? 'Установите wave на iPhone: нажмите «Поделиться» ' + share + ' внизу, затем «На экран „Домой“»'
          : 'Install wave on your iPhone: tap Share ' + share + ' below, then “Add to Home Screen”';
        setTimeout(function () {
          var card = document.createElement('div');
          card.id = 'a2hs';
          card.setAttribute('role', 'dialog');
          card.innerHTML = '<div id="a2hs-text">' + text + '</div><button id="a2hs-close" type="button" aria-label="' + (ru ? 'Закрыть' : 'Close') + '"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="width:12px;height:12px;margin:0;vertical-align:0"><path d="M1 1l10 10M11 1L1 11"/></svg></button>';
          document.body.appendChild(card);
          requestAnimationFrame(function () { card.classList.add('show'); });
          card.querySelector('#a2hs-close').addEventListener('click', function (e) {
            e.stopPropagation();
            card.classList.remove('show');
            setTimeout(function () { card.remove(); }, 300);
          });
        }, 1500);
      } catch (_) {}
    })();
  </script>
</body>
</html>
